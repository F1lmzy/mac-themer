# macthemer-borders — ring styling. Reload: it re-reads on file change.
width=2
# Ring offset from the window edge: 0 = inner edge flush with the
# frame, positive = breathing room, negative = overlap (hides the
# window's own dark edge pixels). If you change gap, adjust radii by
# the same amount to stay concentric.
gap=-1
# Concentric rule: ring radius = WINDOW corner radius + gap + width/2.
# A width change therefore moves every radius by half of it; a gap
# change moves them by all of it. With gap=-1 and width=2 the two
# terms cancel and the ring radius equals the window radius, which is
# why the values below are the measured window radii untouched.
# Window radii measured by circle-fitting live window alpha at 2x
# (2026-08-13): macOS 26 standard ~17.1pt (Arc, Slack, Signal,
# Spotify), Korren ~16.6pt, WhatsApp ~12.9pt. Fractional values fine.
radius=17
# per-app corner radius overrides (frontmost app name, as in cmd-tab;
# invisible format characters in names are ignored):
radius:Korren=16.5
radius:WhatsApp=13
