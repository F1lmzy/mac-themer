# Gruvbox Dark — mac-themer theme pack.
#
# One file per pack. The palette is the base16/ANSI layer terminals need; the
# border colours and the two [tokens]/[bar] overrides pin the values this pack
# shipped with by hand, so nothing shifts colour next to the previous setup.
# Every other token is derived by lib/macthemer/tokens.py.

name = "Gruvbox Dark"
variant = "dark"

[palette]
background = "#282828"
foreground = "#ebdbb2"
cursor = "#ebdbb2"
accent = "#fe8019"
selection_background = "#504945"
selection_foreground = "#ebdbb2"

color0 = "#282828"
color1 = "#cc241d"
color2 = "#98971a"
color3 = "#d79921"
color4 = "#458588"
color5 = "#b16286"
color6 = "#689d6a"
color7 = "#a89984"
color8 = "#928374"
color9 = "#fb4934"
color10 = "#b8bb26"
color11 = "#fabd2f"
color12 = "#83a598"
color13 = "#d3869b"
color14 = "#8ec07c"
color15 = "#ebdbb2"

[border]
active = "#fe8019"
inactive = "#504945"

[tokens]
# Explicit, not derived: the elevation step and the muted text tone are
# judgement calls per palette, and these are the ones already in use.
surface_container = "#3c3836"
muted = "#928374"

[bar]
background_alpha = 0.902
