# Osaka Jade — mac-themer theme pack.
#
# One file per pack. The palette is the base16/ANSI layer terminals need; the
# border colours and the two [tokens]/[bar] overrides pin the values this pack
# shipped with by hand, so nothing shifts colour next to the previous setup.
# Every other token is derived by lib/macthemer/tokens.py.

name = "Osaka Jade"
variant = "dark"

[palette]
background = "#111c18"
foreground = "#c1c497"
cursor = "#d7c995"
accent = "#509475"
selection_background = "#c1c497"
selection_foreground = "#111c18"

color0 = "#23372b"
color1 = "#ff5345"
color2 = "#549e6a"
color3 = "#459451"
color4 = "#509475"
color5 = "#d2689c"
color6 = "#2dd5b7"
color7 = "#f6f5dd"
color8 = "#53685b"
color9 = "#db9f9c"
color10 = "#63b07a"
color11 = "#e5c736"
color12 = "#acd4cf"
color13 = "#75bbb3"
color14 = "#8cd3cb"
color15 = "#9eebb3"

[border]
active = "#509475"
inactive = "#23372b"

[tokens]
# Explicit, not derived: the elevation step and the muted text tone are
# judgement calls per palette, and these are the ones already in use.
surface_container = "#23372b"
muted = "#53685b"

[bar]
background_alpha = 0.902
# This palette's bar red stays on the normal ANSI ramp, not the bright one.
red = "#ff5345"
