# Tokyo Night — mac-themer theme pack.
#
# One file per pack. The palette is the base16/ANSI layer terminals need; the
# border colours and the two [tokens]/[bar] overrides pin the values this pack
# shipped with by hand, so nothing shifts colour next to the previous setup.
# Every other token is derived by lib/macthemer/tokens.py.

name = "Tokyo Night"
variant = "dark"

[palette]
background = "#1a1b26"
foreground = "#c0caf5"
cursor = "#c0caf5"
accent = "#7aa2f7"
selection_background = "#33467c"
selection_foreground = "#c0caf5"

color0 = "#15161e"
color1 = "#f7768e"
color2 = "#9ece6a"
color3 = "#e0af68"
color4 = "#7aa2f7"
color5 = "#bb9af7"
color6 = "#7dcfff"
color7 = "#a9b1d6"
color8 = "#414868"
color9 = "#f7768e"
color10 = "#9ece6a"
color11 = "#e0af68"
color12 = "#7aa2f7"
color13 = "#bb9af7"
color14 = "#7dcfff"
color15 = "#c0caf5"

[border]
active = "#7aa2f7"
inactive = "#3b4261"

[tokens]
# Explicit, not derived: the elevation step and the muted text tone are
# judgement calls per palette, and these are the ones already in use.
surface_container = "#292e42"
muted = "#565f89"

[bar]
background_alpha = 0.902
